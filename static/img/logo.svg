  <line x1="100" y1="100" x2="100" y2="38" stroke="#144365" stroke-width="5" stroke-linecap="round" />
  <line x1="100" y1="100" x2="46.3" y2="131" stroke="#144365" stroke-width="5" stroke-linecap="round" />
  <line x1="100" y1="100" x2="153.7" y2="131" stroke="#144365" stroke-width="5" stroke-linecap="round" />
  <!-- Satellite nodes -->
  <circle cx="100" cy="38" r="22" fill="#2771a0" opacity="0.95" />
  <circle cx="46.3" cy="131" r="22" fill="#2771a0" opacity="0.85" />
