name: "📋 Documentation Task"
description: "Open a documentation task for any project and any phase."
title: "[project] – action"
labels: ["documentation"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        > **How to use:** Select your **project** and **action** below, then update the issue title to `[project-name] – action-name` before submitting.

  # ── Project ───────────────────────────────────────────────────────────────

  - type: dropdown
    id: project
    attributes:
      label: "Project"
      description: "Which project does this task belong to?"
      options:
        - open-project-hub
        - alonso-portfolio
        - orthopedic-spine
    validations:
      required: true

  # ── Action ────────────────────────────────────────────────────────────────

  - type: dropdown
    id: action
    attributes:
      label: "Action"
      description: "Select the documentation phase to perform."
      options:
        - "1 · Kickoff"
        - "2 · Requirements"
        - "3 · Planning"
        - "4.1 · Architecture – High-Level Solution Design"
        - "4.2 · Architecture – Technology Stack"
        - "4.3 · Architecture – API Design Standards"
        - "4.4 · Architecture – API Contract"
        - "4.5 · Architecture – Diagrams"
        - "4.6 · Architecture – Patterns"
        - "4.7 · Architecture – Security"
        - "4.8 · Architecture – Deployment & Infrastructure"
        - "5 · Database Design"
        - "6 · UI/UX Designer Stories"
        - "6.1 · UI/UX Prototype (Stitch)"
        - "7 · Epics"
        - "8 · Backend Engineer Stories"
        - "9 · Frontend Engineer Stories"
    validations:
      required: true

  # ── Request Type ───────────────────────────────────────────────────────────

  - type: dropdown
    id: request_type
    attributes:
      label: "Request Type"
      description: "Is this a request to add new documentation or modify existing documentation?"
      options:
        - "Add New Documentation"
        - "Modify Existing Documentation"
    validations:
      required: true

  # ── Reference ─────────────────────────────────────────────────────────────

  - type: markdown
    attributes:
      value: |
        ### Agent & Output Path Reference

        | Action | Agent | Output path |
        |--------|-------|-------------|
        | 1 · Kickoff | `product-owner` | `docs/projects/{project}/` |
        | 2 · Requirements | `product-owner` | `docs/projects/{project}/01-requirements/` |
        | 3 · Planning | `product-owner` | `docs/projects/{project}/02-planning/` |
        | 4.x · Architecture (all) | `tech-lead` | `docs/projects/{project}/03-architecture/` |
        | 5 · Database Design | `tech-lead` | `docs/projects/{project}/04-database/` |
        | 6 · UI/UX Designer Stories | `product-owner` | `docs/projects/{project}/06-user-stories/` |
        | 6.1 · UI/UX Prototype | `ui-ux-designer` | `docs/projects/{project}/05-prototype/` |
        | 7 · Epics | `product-owner` | `docs/projects/{project}/06-user-stories/` |
        | 8 · Backend Engineer Stories | `product-owner` | `docs/projects/{project}/06-user-stories/` |
        | 9 · Frontend Engineer Stories | `product-owner` | `docs/projects/{project}/06-user-stories/` |

  # ── Context ───────────────────────────────────────────────────────────────

  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Any extra constraints, scope notes, or references relevant to this task."
      placeholder: |
        e.g. Focus only on the authentication module.
        Reference: docs/projects/open-project-hub/01-requirements/01.01-functional-requirements.md
