name: "📋 Documentation Task"
description: "Open a documentation task for any project and any phase."
title: "[project] – action"
labels: ["documentation"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        > **How to use:** Select your **project** and **action** below, then update the issue title to `[project-name] – action-name` before submitting.

  # ── Project ───────────────────────────────────────────────────────────────

  - type: dropdown
    id: project
    attributes:
      label: "Project"
      description: "Which project does this task belong to?"
      options:
        - open-project-hub
        - alonso-portfolio
        - orthopedic-spine
    validations:
      required: true

  # ── Action ────────────────────────────────────────────────────────────────

  - type: dropdown
    id: action
    attributes:
      label: "Action"
      description: "Select the documentation phase to perform."
      options:
        - "1 · Kickoff"
        - "2 · Requirements"
        - "3 · Planning"
        - "4.1 · Architecture – High-Level Solution Design"
        - "4.2 · Architecture – Technology Stack"
        - "4.3 · Architecture – API Design Standards"
        - "4.4 · Architecture – API Contract"
        - "4.5 · Architecture – Diagrams"
        - "4.6 · Architecture – Patterns"
        - "4.7 · Architecture – Security"
        - "4.8 · Architecture – Deployment & Infrastructure"
        - "5 · Database Design"
        - "6 . · UI/UX Prototype (Stitch)"
        - "7 · Work Items"
    validations:
      required: true

  # ── Request Type ───────────────────────────────────────────────────────────

  - type: dropdown
    id: request_type
    attributes:
      label: "Request Type"
      description: "Is this a request to add new documentation or modify existing documentation?"
      options:
        - "Add New Documentation"
        - "Modify Existing Documentation"
    validations:
      required: true

  # ── Execution Scope (Submitted) ──────────────────────────────────────────

  - type: textarea
    id: execution_scope
    attributes:
      label: "Execution Scope (Do not remove)"
      description: "This block is included in the created issue so the agent applies strict output boundaries."
      value: |
        Scope guardrails for generated/modified files:

        - 1 · Kickoff -> only: docs/projects/{project}/overview.md, docs/projects/{project}/open-questions.md, docs/projects/{project}/user-personas.md
        - 2 · Requirements -> only inside: docs/projects/{project}/01-requirements/ | one file per feature (e.g. f-001-feature-name.md); do not consolidate all requirements into a single file
        - 3 · Planning -> only inside: docs/projects/{project}/02-planning/
        - 4.1 · Architecture – High-Level Solution Design -> only inside: docs/projects/{project}/03-architecture/
        - 4.2 · Architecture – Technology Stack -> only inside: docs/projects/{project}/03-architecture/
        - 4.3 · Architecture – API Design Standards -> only inside: docs/projects/{project}/03-architecture/api/
        - 4.4 · Architecture – API Contract -> only inside: docs/projects/{project}/03-architecture/api/
        - 4.5 · Architecture – Diagrams -> only inside: docs/projects/{project}/03-architecture/diagrams/
        - 4.6 · Architecture – Patterns -> only inside: docs/projects/{project}/03-architecture/
        - 4.7 · Architecture – Security -> only inside: docs/projects/{project}/03-architecture/security/
        - 4.8 · Architecture – Deployment & Infrastructure -> only inside: docs/projects/{project}/03-architecture/ops/ and deployment-related docs in docs/projects/{project}/03-architecture/
        - 5 · Database Design -> only inside: docs/projects/{project}/04-database/
        - 6 . · UI/UX Prototype (Stitch) -> only inside: docs/projects/{project}/05-prototype/
        - 7 · Work Items -> only inside: docs/projects/{project}/06-work-items/

        Output size guardrail:
        - Keep PR/file changes limited to the selected action scope above.
        - Do not modify files outside that scope.
    validations:
      required: true

  # ── Reference ─────────────────────────────────────────────────────────────

  - type: markdown
    attributes:
      value: |
        ### Agent & Output Path Reference

        _Display reference only. Enforced limits are captured in the submitted **Execution Scope** field above._

        | Action | Agent | Output path |
        |--------|-------|-------------|
        | 1 · Kickoff | `product-owner` | `docs/projects/{project}/` |
        | 2 · Requirements | `product-owner` | `docs/projects/{project}/01-requirements/` |
        | 3 · Planning | `product-owner` | `docs/projects/{project}/02-planning/` |
        | 4.x · Architecture (all) | `tech-lead` | `docs/projects/{project}/03-architecture/` |
        | 5 · Database Design | `tech-lead` | `docs/projects/{project}/04-database/` |
        | 6 . · UI/UX Prototype | `ui-ux-designer` | `docs/projects/{project}/05-prototype/` |
        | 7 · Work Items | `product-owner` | `docs/projects/{project}/06-work-items/` |

  # ── Context ───────────────────────────────────────────────────────────────

  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Any extra constraints, scope notes, or references relevant to this task."
      placeholder: |
        e.g. Focus only on the authentication module.
        Reference: docs/projects/open-project-hub/01-requirements/01.01-functional-requirements.md
