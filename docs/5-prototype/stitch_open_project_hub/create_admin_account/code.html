<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-container": "#e1dfdf",
                        "surface-tint": "#0059c7",
                        "surface-dim": "#dadada",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffdbcc",
                        "error": "#ba1a1a",
                        "surface-container": "#eeeeee",
                        "inverse-primary": "#afc6ff",
                        "secondary-fixed": "#e4e2e2",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#2f3131",
                        "outline": "#727786",
                        "primary-fixed-dim": "#afc6ff",
                        "on-secondary-container": "#636262",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e8e8e8",
                        "surface-variant": "#e2e2e2",
                        "tertiary-fixed-dim": "#ffb695",
                        "outline-variant": "#c1c6d7",
                        "surface-container-low": "#f3f3f3",
                        "on-primary-fixed": "#001a43",
                        "on-tertiary-fixed": "#351000",
                        "on-tertiary-fixed-variant": "#7c2e00",
                        "secondary-fixed-dim": "#c7c6c6",
                        "on-primary-container": "#fefcff",
                        "secondary": "#5e5e5e",
                        "on-primary-fixed-variant": "#004398",
                        "tertiary": "#9e3d00",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#c64f00",
                        "primary": "#0057c2",
                        "error-container": "#ffdad6",
                        "primary-container": "#006ef2",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#464747",
                        "surface-bright": "#f9f9f9",
                        "surface": "#f9f9f9",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e2e2e2",
                        "on-surface-variant": "#414755",
                        "background": "#f9f9f9",
                        "inverse-on-surface": "#f1f1f1",
                        "on-surface": "#1a1c1c",
                        "on-background": "#1a1c1c",
                        "on-tertiary-container": "#fffbff",
                        "primary-fixed": "#d9e2ff",
                        "on-secondary-fixed": "#1b1c1c"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased">
<!-- Top Navigation Bar -->
<header class="w-full border-b border-slate-200/50 dark:border-slate-800/50 bg-[#f9f9f9] dark:bg-slate-950 font-inter text-sm tracking-tight sticky top-0 z-50">
<div class="flex justify-between items-center w-full px-6 py-3 max-w-full">
<div class="flex items-center gap-8">
<span class="text-xl font-bold tracking-tighter text-[#1a1c1c] dark:text-slate-100">Project Hub</span>
</div>
<nav class="flex items-center gap-6">
<a class="text-[#414755] dark:text-slate-400 hover:text-[#0057c2] transition-colors font-medium flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                    Back to Home
                </a>
<div class="flex items-center gap-3 ml-4">
<span class="material-symbols-outlined text-[#414755] p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-all">help</span>
<span class="material-symbols-outlined text-[#414755] p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-all">notifications</span>
</div>
</nav>
</div>
</header>
<main class="min-h-[calc(100vh-64px)] flex items-center justify-center p-6 relative overflow-hidden">
<!-- Background Accents (Precision Editorial Tonal Layering) -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none opacity-20">
<div class="absolute top-[-10%] right-[-5%] w-[40%] h-[60%] bg-primary-fixed rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[30%] h-[50%] bg-secondary-fixed rounded-full blur-[100px]"></div>
</div>
<!-- Create Account Card -->
<div class="w-full max-w-[520px] bg-surface-container-lowest backdrop-blur-xl bg-opacity-80 p-10 rounded-xl shadow-[0_12px_32px_rgba(26,28,28,0.04)] relative z-10">
<!-- Form Header -->
<div class="mb-10 text-center">
<h1 class="text-[1.75rem] font-bold leading-tight tracking-tight text-on-surface mb-3">Create Admin Account</h1>
<p class="text-on-surface-variant text-sm font-medium opacity-80">Only Admin users create and manage planning workspaces.</p>
</div>
<form class="space-y-6">
<!-- Full Name Field -->
<div class="space-y-2">
<label class="text-[0.6875rem] font-bold tracking-widest text-on-surface-variant uppercase" for="fullname">Full Name</label>
<div class="relative group">
<input class="w-full h-[48px] bg-surface-container-low border-0 px-4 rounded-md focus:ring-2 focus:ring-primary transition-all text-on-surface placeholder:text-outline-variant" id="fullname" placeholder="Enter your full name" type="text"/>
</div>
</div>
<!-- Work Email Field -->
<div class="space-y-2">
<label class="text-[0.6875rem] font-bold tracking-widest text-on-surface-variant uppercase" for="email">Work Email</label>
<div class="relative group">
<input class="w-full h-[48px] bg-surface-container-low border-0 px-4 rounded-md focus:ring-2 focus:ring-primary transition-all text-on-surface placeholder:text-outline-variant" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-2">
<label class="text-[0.6875rem] font-bold tracking-widest text-on-surface-variant uppercase" for="password">Password</label>
<input class="w-full h-[48px] bg-surface-container-low border-0 px-4 rounded-md focus:ring-2 focus:ring-primary transition-all text-on-surface placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="space-y-2">
<label class="text-[0.6875rem] font-bold tracking-widest text-on-surface-variant uppercase" for="confirm-password">Confirm Password</label>
<input class="w-full h-[48px] bg-surface-container-low border-0 px-4 rounded-md focus:ring-2 focus:ring-primary transition-all text-on-surface placeholder:text-outline-variant" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start gap-3 py-2">
<div class="flex items-center h-5">
<input class="h-4 w-4 rounded-sm border-outline-variant text-primary focus:ring-primary" id="terms" name="terms" type="checkbox"/>
</div>
<div class="text-sm">
<label class="text-on-surface-variant leading-relaxed" for="terms">
                            I agree to the <a class="text-primary font-semibold hover:underline" href="#">terms</a> and <a class="text-primary font-semibold hover:underline" href="#">prototype conditions</a>.
                        </label>
</div>
</div>
<!-- Actions -->
<div class="pt-4 space-y-6">
<button class="w-full h-[48px] bg-gradient-to-br from-primary to-primary-container text-white font-semibold rounded-md shadow-lg shadow-primary/20 hover:scale-[1.01] active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Create Account
                    </button>
<div class="text-center">
<a class="text-sm text-on-primary-fixed-variant font-medium hover:text-primary transition-colors inline-flex items-center gap-1" href="#">
                            Already have an account? <span class="font-bold underline">Sign In</span>
</a>
</div>
</div>
</form>
</div>
<!-- Floating Decorative Element -->
<div class="absolute bottom-12 right-12 hidden xl:block">
<div class="bg-surface-container-high p-4 rounded-lg flex items-center gap-4 border-l-4 border-primary">
<div class="h-10 w-10 bg-primary-container rounded-sm flex items-center justify-center text-white">
<span class="material-symbols-outlined">admin_panel_settings</span>
</div>
<div>
<p class="text-[0.6875rem] font-bold tracking-widest text-on-surface-variant uppercase">Identity Status</p>
<p class="text-sm font-semibold text-on-surface">Awaiting Configuration</p>
</div>
</div>
</div>
</main>
<!-- Footer Meta -->
<footer class="w-full py-8 text-center text-outline text-[0.6875rem] font-medium tracking-widest uppercase">
        Project Hub Administrative Environment © 2024
    </footer>
</body></html>
