<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container": "#eeeeee",
              "outline-variant": "#c1c6d7",
              "inverse-surface": "#2f3131",
              "surface-container-high": "#e8e8e8",
              "surface-tint": "#0059c7",
              "on-primary": "#ffffff",
              "secondary": "#5e5e5e",
              "on-error-container": "#93000a",
              "tertiary-fixed-dim": "#ffb695",
              "error-container": "#ffdad6",
              "surface-container-highest": "#e2e2e2",
              "error": "#ba1a1a",
              "secondary-fixed-dim": "#c7c6c6",
              "surface": "#f9f9f9",
              "inverse-on-surface": "#f1f1f1",
              "primary": "#0057c2",
              "on-primary-fixed-variant": "#004398",
              "secondary-container": "#e1dfdf",
              "on-primary-fixed": "#001a43",
              "surface-dim": "#dadada",
              "surface-container-lowest": "#ffffff",
              "primary-fixed-dim": "#afc6ff",
              "secondary-fixed": "#e4e2e2",
              "on-surface-variant": "#414755",
              "on-tertiary-fixed-variant": "#7c2e00",
              "primary-fixed": "#d9e2ff",
              "on-secondary-fixed-variant": "#464747",
              "surface-bright": "#f9f9f9",
              "surface-variant": "#e2e2e2",
              "on-primary-container": "#fefcff",
              "on-error": "#ffffff",
              "background": "#f9f9f9",
              "tertiary-container": "#c64f00",
              "on-tertiary-container": "#fffbff",
              "inverse-primary": "#afc6ff",
              "on-background": "#1a1c1c",
              "on-tertiary": "#ffffff",
              "on-tertiary-fixed": "#351000",
              "on-secondary": "#ffffff",
              "primary-container": "#006ef2",
              "on-surface": "#1a1c1c",
              "tertiary-fixed": "#ffdbcc",
              "tertiary": "#9e3d00",
              "on-secondary-fixed": "#1b1c1c",
              "surface-container-low": "#f3f3f3",
              "on-secondary-container": "#636262",
              "outline": "#727786"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        /* Precision Editorial: Background Tonal Layering */
        body {
            background-color: #f9f9f9; /* surface */
            color: #1a1c1c; /* on-surface */
        }
    </style>
</head>
<body class="font-body antialiased min-h-screen flex items-center justify-center p-6">
<!-- Background Decoration (Editorial Asymmetry) -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-fixed opacity-20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[30%] h-[30%] bg-surface-container-highest opacity-50 rounded-full blur-[80px]"></div>
</div>
<!-- Main Container: Centered Modal-like structure using Surface Hierarchy -->
<main class="w-full max-w-[440px] flex flex-col gap-8">
<!-- Brand / Identity Section -->
<header class="text-center space-y-4">
<div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container-lowest shadow-[0_12px_32px_rgba(26,28,28,0.06)] rounded-xl mb-4">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="shield_person" style="">shield_person</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tight text-on-surface font-headline" style="">Admin Sign In</h1>
<div class="inline-block px-4 py-2 bg-surface-container-low rounded-lg">
<p class="text-sm text-on-surface-variant font-medium" style=""><br/></p>
</div>
</header>
<!-- Sign In Form: Glassmorphism/Tonal Layering Card -->
<section class="bg-surface-container-lowest/80 backdrop-blur-xl p-8 rounded-xl shadow-[0_12px_32px_rgba(26,28,28,0.06)] border border-outline-variant/15">
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant label-sm" for="email" style="">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl" data-icon="mail" style="">mail</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-surface-container-low border-none focus:ring-2 focus:ring-primary rounded-lg text-on-surface placeholder:text-outline transition-all duration-200 outline-none" id="email" name="email" placeholder="admin@projecthub.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant label-sm" for="password" style="">Password</label>
<a class="text-xs font-semibold text-on-primary-fixed-variant hover:text-primary transition-colors" href="#" style="">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl" data-icon="lock" style="">lock</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-surface-container-low border-none focus:ring-2 focus:ring-primary rounded-lg text-on-surface placeholder:text-outline transition-all duration-200 outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" style="" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility" style="">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-3 py-1">
<div class="relative flex items-center">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-low" id="remember" type="checkbox"/>
</div>
<label class="text-sm font-medium text-on-surface-variant cursor-pointer" for="remember" style="">Remember me</label>
</div>
<!-- Primary Action -->
<button class="w-full h-[52px] bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-lg shadow-sm hover:shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2" style="" type="submit">
<span class="" style="">Sign In</span>
<span class="material-symbols-outlined text-xl" data-icon="login" style="">login</span>
</button>
</form>
</section>
<!-- Footer / Redirects -->
<footer class="text-center space-y-6">
<p class="text-sm text-on-surface-variant" style="">
                New to the portal? <a class="font-bold text-on-primary-fixed-variant hover:underline" href="#" style="">Create account</a>
</p>
</footer>
</main>
<!-- Editorial Accent: Bottom Right Status -->
</body></html>
